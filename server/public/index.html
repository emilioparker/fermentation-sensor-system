<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
<script>

    const url = new URL(window.location.href);
    const sensor_id = url.searchParams.get("sensor");

    async function getReport() 
    {
        const response = await fetch('/report?sensor='+sensor_id); // your endpoint
        const text = await response.text();
        console.log("report data " + text)
        const items = text.trim().split(',');

        const isNewFormat = items[0] === '01';
        var sensor = isNewFormat ? items[1] : items[0];
        var lastRecordedDate = isNewFormat ? items[2] : items[1];

        return {sensor, lastRecordedDate};
    }

    async function loadData() 
    {
        var report = await getReport();
        if(report.lastRecordedDate == "error")
        {
            return null;
        }

        const date = report.lastRecordedDate.split("T")[0]; // "2025-10-13"
        console.log("requested_date " + date);
        const response = await fetch('/samples?sensor='+sensor_id+'&date=' + date); // your endpoint
        const csvText = await response.text();
        const lines = csvText.trim().split('\n');

        const labels = [];
        const sensorA = [];
        const sensorB = [];
        const sensorC = [];
        const sensorD = [];
        const humidity = [];
        const ambientTemp = [];

        for (const line of lines)
        {
            const fields = line.split(',');
            let timestamp, a, b, c, d, hum, amb;

            if (fields.length >= 9) {
                // version,sensor_id,date,temp1,temp2,temp3,temp4,humidity,ambient_temperature
                [, , timestamp, a, b, c, d, hum, amb] = fields;
            } else {
                // sensor_id,date,temp1,temp2,temp3
                [, timestamp, a, b, c] = fields;
            }

            labels.push(new Date(timestamp));
            sensorA.push(parseFloat(a));
            sensorB.push(parseFloat(b));
            sensorC.push(parseFloat(c));
            if (d !== undefined) sensorD.push(parseFloat(d));
            if (hum !== undefined) humidity.push(parseFloat(hum));
            if (amb !== undefined) ambientTemp.push(parseFloat(amb));
        }

        return { labels, sensorA, sensorB, sensorC, sensorD, humidity, ambientTemp };
    }

    // ... your chart configuration

    async function makeChart() {
      const data = await loadData();

      console.log(data);

      if(data == null) return;

      const datasets = [
        { label: 'Sensor A', data: data.sensorA, borderColor: 'orange', fill: false },
        { label: 'Sensor B', data: data.sensorB, borderColor: 'cyan',   fill: false },
        { label: 'Sensor C', data: data.sensorC, borderColor: 'lime',   fill: false },
      ];

      if (data.sensorD.length > 0) {
        datasets.push({ label: 'Sensor D',          data: data.sensorD,    borderColor: 'violet',  fill: false });
        datasets.push({ label: 'Humidity (%)',       data: data.humidity,   borderColor: 'skyblue', fill: false, borderDash: [5,5] });
        datasets.push({ label: 'Ambient Temp',       data: data.ambientTemp,borderColor: 'salmon',  fill: false, borderDash: [5,5] });
      }

      new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: data.labels,
          datasets,
        },
        options: {
          scales: {
            x: {
              type: 'time',
              time: { unit: 'minute' },
              ticks: { color: '#bbb' },
            },
            y: {
              ticks: { color: '#bbb' },
            }
          },
          plugins: {
            legend: { labels: { color: '#fff' } }
          }
        }
      });
    }

    makeChart();
  </script>
